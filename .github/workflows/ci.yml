name: CI Pipeline (100% Free)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10 & SQL Server 2022)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_password123!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'Directory.Packages.props'

      - name: Restore Dependencies
        run: dotnet restore Pos.slnx

      - name: Build Solution (Release with TreatWarningsAsErrors)
        run: dotnet build -c Release Pos.slnx --no-restore /p:TreatWarningsAsErrors=true

      - name: Restore Local Tools (dotnet-ef)
        run: dotnet tool restore

      - name: Verify No Pending Model Changes (dotnet ef migrations has-pending-model-changes)
        run: dotnet ef migrations has-pending-model-changes --project src/Pos.Infrastructure --startup-project src/Pos.Api

      - name: Generate Migrations Bundle (dotnet ef migrations bundle)
        run: dotnet ef migrations bundle --project src/Pos.Infrastructure --startup-project src/Pos.Api --output ./efbundle --configuration Release --verbose

      - name: Apply Migrations Bundle to SQL Server 2022
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "Server=localhost,1433;Database=PosIntegrationTests;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"
          ./efbundle --connection "Server=localhost,1433;Database=PosInfrastructureTests;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"

      - name: Run Domain Tests
        run: dotnet test tests/Pos.Domain.Tests/Pos.Domain.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Application Tests
        run: dotnet test tests/Pos.Application.Tests/Pos.Application.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Architecture Tests
        run: dotnet test tests/Pos.Architecture.Tests/Pos.Architecture.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Infrastructure Tests
        env:
          IntegrationTests__ConnectionString: "Server=localhost,1433;Database=PosInfrastructureTests;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"
        run: dotnet test tests/Pos.Infrastructure.Tests/Pos.Infrastructure.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Integration Tests
        env:
          IntegrationTests__ConnectionString: "Server=localhost,1433;Database=PosIntegrationTests;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"
        run: dotnet test tests/Pos.IntegrationTests/Pos.IntegrationTests.csproj -c Release --no-build --verbosity normal
